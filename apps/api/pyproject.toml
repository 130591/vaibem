[project]
name = "vaibem-platform"
version = "0.1.0"
description = "School journey and student safety platform"
requires-python = ">=3.12"

dependencies = [
	"fastapi",
	"uvicorn[standard]",
	"strawberry-graphql",
	"sqlalchemy",
	"geoalchemy2",
	"asyncpg",
	"alembic",
	"pydantic-settings",
	"redis",
	"boto3",
	"structlog",
]

[dependency-groups]
dev = [
	"pytest",
	"pytest-asyncio",
	"httpx",
	"ruff",
]

[tool.pytest.ini_options]
pythonpath = ["src", "../.."]
asyncio_mode = "auto"


[tool.ruff]
line-length = 100
target-version = "py312"